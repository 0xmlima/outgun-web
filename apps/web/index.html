<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Capture a bandeira com os amigos, direto no navegador. O clássico Outgun, agora na web: partidas Casual com convidados e Ranked por temporada."
    />
    <meta name="theme-color" content="#000040" />
    <!-- prévia de compartilhamento (OG-305); o Caddy do cliente web preenche o domínio (templates) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Outgun Web" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Outgun Web: capture a bandeira no navegador" />
    <meta
      property="og:description"
      content="O clássico Outgun, agora na web. Jogue grátis com os amigos: Casual com convidados ou Ranked por temporada."
    />
    <meta property="og:url" content="https://{{html .Host}}/" />
    <meta property="og:image" content="https://{{html .Host}}/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Outgun Web: jogadores dos times vermelho e azul e a bandeira numa sala verde"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- app instalável pelo Chrome/Edge (OG-323, D-58): sem service worker, sempre a versão do site -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Outgun Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
