# Dependências locais da API: docker compose -f apps/api/compose.yaml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outgun
      POSTGRES_PASSWORD: outgun
      POSTGRES_DB: outgun
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
