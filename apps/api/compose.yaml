# Dependências locais da API (PostgreSQL, Redis, Mailpit): docker compose -f apps/api/compose.yaml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outgun
      POSTGRES_PASSWORD: outgun
      POSTGRES_DB: outgun
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  # Caixa de saída local: a API envia com MAILER=mailpit; mensagens em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['8025:8025']
volumes:
  pgdata:
