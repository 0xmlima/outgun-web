# Métricas, painel e alertas do Outgun Web (OG-102) para desenvolvimento e homologação.
# Uso: docker compose -f tools/observability/docker-compose.yml up -d
# Prometheus em http://localhost:9090, Alertmanager em :9093, Grafana em :3000 (painel "Outgun").
# Coleta o game server (7700) e a API (7800) da máquina; METRICS_TOKEN vazio nos dois.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      [
        '--config.file=/etc/prometheus/prometheus.yml',
        '--storage.tsdb.retention.time=15d',
        '--web.enable-lifecycle',
      ]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports: ['9090:9090']
    extra_hosts: ['host.docker.internal:host-gateway']
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ['--config.file=/etc/alertmanager/alertmanager.yml']
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports: ['9093:9093']
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/outgun.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3000:3000']
