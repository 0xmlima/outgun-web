global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - rules/*.rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: game-server
    static_configs:
      - targets: ['host.docker.internal:7700']
        labels: { region: local }
  - job_name: api
    static_configs:
      - targets: ['host.docker.internal:7800']
