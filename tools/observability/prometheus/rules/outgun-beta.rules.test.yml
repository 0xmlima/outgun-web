# promtool test rules: queda em massa (OG-454) e memória baixa da VM (OG-455).
rule_files:
  - outgun-beta.rules.yml
evaluation_interval: 10s
tests:
  # 6 jogadores caem sem aviso no mesmo minuto; 2 saídas normais (1000) não contam
  - interval: 10s
    input_series:
      - series: 'outgun_ws_closed_total{instance="vps",kind="player",code="1006"}'
        values: '0 0 0 0 0 0 6 6 6 6 6 6 6 6 6 6 6 6 6 6'
      - series: 'outgun_ws_closed_total{instance="vps",kind="player",code="1000"}'
        values: '0 1 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2 2'
      - series: 'up{job="game-server",instance="vps"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 30s
        alertname: OutgunQuedaEmMassa
        exp_alerts: []
      - eval_time: 70s
        alertname: OutgunQuedaEmMassa
        exp_alerts:
          - exp_labels: { severity: page, instance: vps }
            exp_annotations:
              summary: '6 jogadores caíram sem aviso no último minuto em vps'
              description: 'Código 1006 é queda sem fechamento (rede ou processo travado). Veja os logs do game server no mesmo minuto: {service="game-server"}.'
      - eval_time: 3m
        alertname: OutgunQuedaEmMassa
        exp_alerts: []
      - eval_time: 3m
        alertname: OutgunSemMetricasDoJogo
        exp_alerts: []
  # 950 MB de RAM: 80 MB disponíveis (8%) por 10 minutos
  - interval: 1m
    input_series:
      - series: 'node_memory_MemTotal_bytes{instance="beta"}'
        values: '950000000x12'
      - series: 'node_memory_MemAvailable_bytes{instance="beta"}'
        values: '400000000 80000000x11'
    alert_rule_test:
      - eval_time: 3m
        alertname: OutgunVmMemoriaBaixa
        exp_alerts: []
      - eval_time: 7m
        alertname: OutgunVmMemoriaBaixa
        exp_alerts:
          - exp_labels: { severity: page, instance: beta }
            exp_annotations:
              summary: 'Menos de 10% de memória disponível na VM há 5 minutos'
