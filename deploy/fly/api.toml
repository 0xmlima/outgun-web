# API no Fly.io (D-04, OG-103). O nome do app vem do workflow (--app outgun-api ou outgun-api-staging).
# Só rede privada: `fly ips allocate-v6 --private`; o cliente chega pelo /api do app web (Flycast).
# Segredos (fly secrets set): DATABASE_URL, REDIS_URL, TICKET_SIGNING_KEYS, INTERNAL_SECRETS,
# RESEND_API_KEY, METRICS_TOKEN, SENTRY_DSN.
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 30

[deploy]
  # migrations uma vez, antes de trocar as máquinas; as instâncias sobem com MIGRATE=0
  release_command = "node dist/cli.js migrate up"
  # máquinas novas recebem tráfego só depois de passar no /health; as antigas saem com SIGTERM
  # (/health 503 por SHUTDOWN_GRACE_S e fecham esperando os pedidos em andamento)
  strategy = "bluegreen"

[env]
  NODE_ENV = "production"
  PORT = "7800"
  MIGRATE = "0"
  TRUST_PROXY = "1"
  SHUTDOWN_GRACE_S = "5"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 7800
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "10s"
    interval = "5s"
    timeout = "2s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
