# Cliente web no Fly.io (D-04, OG-103): Caddy com os estáticos e /api para a API pela rede privada.
# Domínio próprio: `fly certs add <domínio>` (TLS automático). API_UPSTREAMS e CSP_CONNECT_SRC
# por ambiente no workflow (--env).
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 15

[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "5s"
    interval = "10s"
    timeout = "2s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
