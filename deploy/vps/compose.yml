# SPDX-License-Identifier: GPL-2.0-or-later
# Outgun Web numa máquina só (OG-109): qualquer VPS Linux com Docker. O Caddy da borda faz HTTPS
# (Let's Encrypt) para DOMAIN; o cliente e /api vão para o Caddy do cliente web, e /gs/* para o game
# server (WebSocket em wss://DOMAIN/gs/rooms/...). Só 80/443 ficam expostas.
# Variáveis em /opt/outgun/.env (geradas pelo install.sh): DOMAIN, TAG e os segredos; DOMAIN_ALIASES
# (opcional) são nomes que redirecionam para DOMAIN.
name: outgun

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    # labels: o serviço do compose vai em cada linha do log, para o Fluent Bit rotular (OG-457)
    options: { max-size: 20m, max-file: '5', labels: com.docker.compose.service }

services:
  edge:
    <<: *restart
    image: caddy:2.10.2-alpine
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # instalador do cliente para Windows (OG-325), enviado por upload-desktop.sh
      - ./downloads:/srv/downloads:ro
    depends_on: [web, game-server]

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      { POSTGRES_USER: outgun, POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}', POSTGRES_DB: outgun }
    # estatísticas de queries para o monitoramento (OG-453); a extensão é criada pela migration 0044
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'pg_stat_statements.max=1000',
        '-c',
        'pg_stat_statements.track=top',
      ]
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'outgun'], interval: 2s, retries: 30 }
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    <<: *restart
    image: redis:7-alpine
    # senha mesmo na rede interna (OG-308)
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']

  migrate:
    image: outgun-api:${TAG}
    env_file: .env
    environment:
      DATABASE_URL: postgres://outgun:${POSTGRES_PASSWORD}@postgres:5432/outgun
    command: ['node', 'dist/cli.js', 'migrate', 'up']
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *restart
    image: outgun-api:${TAG}
    env_file: .env
    environment:
      # papel sem DDL (OG-308); as migrations rodam só no container migrate, com o dono do schema
      DATABASE_URL: postgres://outgun_app:${APP_DB_PASSWORD}@postgres:5432/outgun
      MIGRATE: '0'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_URL: https://${DOMAIN}
      TRUST_PROXY: '1'
      MAILER: ${MAILER:-log}
      RELEASE: ${RELEASE:-${TAG}}
      # vigia (OG-313): disco e hora do último backup bom; alertas para ALERT_EMAIL (no .env)
      BACKUP_STATUS_DIR: /backup-status
    volumes: ['./backup-status:/backup-status:ro']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  game-server:
    <<: *restart
    image: outgun-game-server:${TAG}
    env_file: .env
    environment:
      API_URL: http://api:7800
      TICKET_JWKS_URL: http://api:7800/.well-known/jwks.json
      PUBLIC_WS_URL: wss://${DOMAIN}/gs
      ALLOWED_ORIGINS: https://${DOMAIN}
      REGION: ${REGION:-beta}
      TRUST_PROXY: '1'
      GS_ID: vps
      RELEASE: ${RELEASE:-${TAG}}
    stop_grace_period: 300s
    volumes: [replays:/data/replays]
    depends_on: [api]

  web:
    <<: *restart
    image: outgun-web:${TAG}
    environment:
      API_UPSTREAMS: api:7800
      CSP_CONNECT_SRC: wss://${DOMAIN} https://${DOMAIN} ${CSP_EXTRA:-}
    depends_on: [api]

  backup:
    <<: *restart
    image: outgun-backup:${TAG}
    environment:
      DATABASE_URL: postgres://outgun:${POSTGRES_PASSWORD}@postgres:5432/outgun
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_STATUS_DIR: /backup-status
    # um backup por dia (o primeiro uma hora depois de subir)
    entrypoint:
      ['sh', '-c', 'sleep 3600; while true; do sh /usr/local/bin/backup.sh; sleep 86400; done']
    volumes: [./backups:/backup, ./backup-status:/backup-status]
    depends_on:
      postgres: { condition: service_healthy }

  # métricas e logs para o Grafana Cloud (OG-457, no lugar do Alloy do OG-452, que não coube na
  # E2.1.Micro). Fora do perfil padrão: o install.sh só sobe com as credenciais no .env
  # (deploy/vps/grafana-cloud.sh). Nenhum dos dois publica porta. O Fluent Bit lê /proc, /sys e o
  # disco da VM (montados em /rootfs) e os arquivos de log do Docker; não usa o socket do Docker.
  fluent-bit:
    <<: *restart
    image: fluent/fluent-bit:5.1.4
    profiles: [observabilidade]
    command: ['-c', '/fluent-bit/etc/outgun/fluent-bit.yaml']
    environment:
      GRAFANA_CLOUD_PROM_HOST: ${GRAFANA_CLOUD_PROM_HOST:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_LOKI_HOST: ${GRAFANA_CLOUD_LOKI_HOST:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OUTGUN_HOST_LABEL: beta
    mem_limit: 64m
    volumes:
      - ./fluent-bit:/fluent-bit/etc/outgun:ro
      - fluent-bit-data:/data
      - /:/rootfs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [api, game-server, postgres-exporter]

  # métricas do banco (OG-453) com o papel outgun_monitor (pg_monitor: só as visões de estatística)
  postgres-exporter:
    <<: *restart
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: [observabilidade]
    command:
      [
        '--collector.stat_statements',
        '--collector.stat_statements.include_query',
        '--collector.stat_statements.query_length=160',
        '--collector.long_running_transactions',
        '--no-collector.statio_user_tables',
      ]
    environment:
      DATA_SOURCE_NAME: postgresql://outgun_monitor:${MONITOR_DB_PASSWORD:-}@postgres:5432/outgun?sslmode=disable
    mem_limit: 48m
    depends_on: [postgres]

volumes:
  pgdata:
  replays:
  caddy-data:
  caddy-config:
  fluent-bit-data:
