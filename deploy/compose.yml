# SPDX-License-Identifier: GPL-2.0-or-later
# Homologação local com as imagens de produção (OG-103): PostgreSQL, Redis, migrations, duas
# instâncias da API atrás do Caddy do cliente web e um game server, em NODE_ENV=production.
#   bash deploy/staging.sh up      (gera deploy/.env.staging com segredos na primeira vez)
#   http://localhost:18080 (cliente e /api), ws://localhost:17700 (game server)
name: outgun-staging

x-api: &api
  image: outgun-api:dev
  env_file: .env.staging
  environment:
    DATABASE_URL: postgres://outgun:outgun@postgres:5432/outgun
    REDIS_URL: redis://redis:6379
    WEB_URL: http://localhost:18080
    TRUST_PROXY: '1'
    MAILER: memory
    LOG_LEVEL: warn
    DEV_ROOM_WS_URL: ''
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: outgun, POSTGRES_PASSWORD: outgun, POSTGRES_DB: outgun }
    healthcheck: { test: ['CMD', 'pg_isready', '-U', 'outgun'], interval: 1s, retries: 30 }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  migrate:
    <<: *api
    command: ['node', 'dist/cli.js', 'migrate', 'up']
    depends_on:
      postgres: { condition: service_healthy }
  api-1: *api
  api-2: *api
  game-server:
    image: outgun-game-server:dev
    env_file: .env.staging
    environment:
      API_URL: http://api-1:7800
      TICKET_JWKS_URL: http://api-1:7800/.well-known/jwks.json
      PUBLIC_WS_URL: ws://localhost:17700
      REGION: local
      TRUST_PROXY: '0'
      LOG_LEVEL: warn
      ROTATION: ${ROTATION:-outgun1}
      CASUAL_BOTS_FILL: ${CASUAL_BOTS_FILL:-0}
      GAMEMOD: ${GAMEMOD:-}
      DRAIN_TIMEOUT_S: ${DRAIN_TIMEOUT_S:-240}
    stop_grace_period: 300s
    ports: ['17700:7700']
    depends_on: [api-1, api-2]
  web:
    image: outgun-web:dev
    environment:
      API_UPSTREAMS: api-1:7800 api-2:7800
      CSP_CONNECT_SRC: ws://localhost:17700 http://localhost:17700
    ports: ['18080:8080']
    depends_on: [api-1, api-2]

volumes:
  pgdata:
