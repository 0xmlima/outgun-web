packages:
  - apps/*
  # cliente desktop (OG-324): npm próprio, para o install do monorepo não baixar o Electron
  - '!apps/desktop'
  - packages/*
  - tools/*

# core-js (via canvg, dependência opcional do jsPDF do PDF do relatório, OG-425): o script de
# instalação só imprime um aviso; sem esta linha o `pnpm install --frozen-lockfile` falha no CI/Docker
allowBuilds:
  core-js: false
