name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:legacy
      - run: pnpm check:licenses
      - name: Regras de alerta e painel (OG-102)
        run: bash tools/observability/check.sh
      - name: Relatório de paridade com o Outgun original
        if: always()
        run: pnpm parity --report tools/parity/out/parity-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: tools/parity/out/parity-report.md
