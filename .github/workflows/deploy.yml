# SPDX-License-Identifier: GPL-2.0-or-later
# Deploy contínuo no Fly.io (D-04, OG-103): main → homologação; tag v* → produção (o ambiente
# "production" do GitHub pede aprovação). Ordem: API (migrations no release_command) → game
# servers (rolling com drenagem) → cliente web. Segredo FLY_API_TOKEN por ambiente; variáveis
# FLY_PREFIX (outgun), WEB_HOST, SENTRY_DSN_WEB opcionais.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: deploy-${{ github.ref_type == 'tag' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'production' || 'staging' }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SUFFIX: ${{ github.ref_type == 'tag' && '' || '-staging' }}
      PREFIX: ${{ vars.FLY_PREFIX || 'outgun' }}
      RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - name: API
        run: >-
          flyctl deploy . --config deploy/fly/api.toml --app "$PREFIX-api$SUFFIX"
          --dockerfile deploy/Dockerfile --build-target api --remote-only
          --env RELEASE="$RELEASE" --env WEB_URL="https://${{ vars.WEB_HOST || format('{0}-web{1}.fly.dev', vars.FLY_PREFIX || 'outgun', github.ref_type == 'tag' && '' || '-staging') }}"
      - name: Game servers
        run: >-
          flyctl deploy . --config deploy/fly/game-server.toml --app "$PREFIX-gs$SUFFIX"
          --dockerfile deploy/Dockerfile --build-target game-server --remote-only
          --env RELEASE="$RELEASE"
          --env PUBLIC_WS_URL="wss://$PREFIX-gs$SUFFIX.fly.dev/m/{instance}"
          --env API_URL="http://$PREFIX-api$SUFFIX.flycast"
          --env TICKET_JWKS_URL="http://$PREFIX-api$SUFFIX.flycast/.well-known/jwks.json"
      - name: Cliente web
        run: >-
          flyctl deploy . --config deploy/fly/web.toml --app "$PREFIX-web$SUFFIX"
          --dockerfile deploy/Dockerfile --build-target web --remote-only
          --build-arg VITE_RELEASE="$RELEASE" --build-arg VITE_SENTRY_DSN="${{ vars.SENTRY_DSN_WEB }}"
          --env API_UPSTREAMS="$PREFIX-api$SUFFIX.flycast:80"
          --env CSP_CONNECT_SRC="https://$PREFIX-gs$SUFFIX.fly.dev wss://$PREFIX-gs$SUFFIX.fly.dev ${{ vars.SENTRY_ORIGIN }}"
      - name: Fumaça
        run: |
          host="${{ vars.WEB_HOST || format('{0}-web{1}.fly.dev', vars.FLY_PREFIX || 'outgun', github.ref_type == 'tag' && '' || '-staging') }}"
          curl -fsS "https://$host/api/health"
          curl -fsSI "https://$host/" | grep -i content-security-policy
